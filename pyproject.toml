[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybindb"
version = "0.1.0"
description = "Encrypted Binary Block Database with Windows Vault and YubiKey PIV support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "pywin32-ctypes>=0.2.0; sys_platform == 'win32'",
    "yubikey-manager>=5.4.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
]

[project.scripts]
pybindb = "pybindb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

